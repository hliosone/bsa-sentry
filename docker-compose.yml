# Production topology: the server (auth, OAuth, MCP, relay, facilitator) and the demo
# merchants. The merchants' x402 middleware asks the facilitator /supported ONCE at startup,
# so they only start once the server reports healthy.
services:
  server:
    build: .
    env_file: .env
    environment:
      PORT: 8787
      DB_PATH: /data/bsa-sentry.sqlite
    ports: ["8787:8787"]
    volumes: ["bsa-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  merchants:
    build: .
    command: ["pnpm", "--filter", "@bsa-sentry/merchants", "start"]
    env_file: .env
    environment:
      MERCHANTS_PORT: 4021
      FACILITATOR_URL: http://server:8787/x402
    ports: ["4021:4021"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bsa-data:
