[package]
name = "bsa-sentry-core"
version = "0.1.0"
edition = "2021"
description = "Pure decision and encoding logic for the BSA Sentry Ledger app. no_std on the device, cargo test on the host."

# Deliberately dependency-free: this crate is the part of the app that must be auditable
# and host-testable. Keccak comes in through a trait so the device can use the SDK's
# implementation and the host tests a normal crate.
[dependencies]

[dev-dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
serde_json = "1"
hex = "0.4"

[lints.rust]
unsafe_code = "forbid"
